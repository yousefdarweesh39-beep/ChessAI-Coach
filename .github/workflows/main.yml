
name: Build Chess AI Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: 
          unzip -q ChessAICoach-download.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" -Pkotlin.jvm.target.validation.mode=warning assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-Coach-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
